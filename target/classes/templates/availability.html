<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Availability</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Hotel Management</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbars">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbars">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/hotels">Hotels</a></li>
                <li class="nav-item"><a class="nav-link" href="/room-types">Room Types</a></li>
                <li class="nav-item"><a class="nav-link" href="/rooms">Rooms</a></li>
                <li class="nav-item"><a class="nav-link" href="/guests">Guests</a></li>
                <li class="nav-item"><a class="nav-link" href="/reservations">Reservations</a></li>
                <li class="nav-item"><a class="nav-link active" href="/availability">Availability</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="h3">Room Availability</h1>
        <button class="btn btn-primary" type="button">Check Availability</button>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <form method="get" action="/availability">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Hotel</label>
                        <select class="form-select" name="hotelId">
                            <option value="" selected>Select hotel</option>
                            <option th:each="hotel : ${hotels}" th:value="${hotel.id}" th:text="${hotel.name}"
                                    th:selected="${hotel.id == selectedHotelId}">Hotel</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Check-in</label>
                        <input class="form-control" type="date" name="checkInDate" th:value="${selectedCheckIn}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Check-out</label>
                        <input class="form-control" type="date" name="checkOutDate" th:value="${selectedCheckOut}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Guests</label>
                        <input class="form-control" type="number" min="1" name="guests" th:value="${selectedGuests}" placeholder="2">
                    </div>
                    <div class="col-12">
                        <button class="btn btn-success" type="submit">Search</button>
                        <a class="btn btn-outline-secondary" href="/availability">Reset</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-header">Available Rooms</div>
        <div class="table-responsive">
            <table class="table table-striped mb-0">
                <thead>
                <tr>
                    <th>Room Number</th>
                    <th>Floor</th>
                    <th>Room Type</th>
                    <th>Hotel</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="room : ${availability}">
                    <td th:text="${room.roomNumber}">301</td>
                    <td th:text="${room.floor}">3</td>
                    <td th:text="${room.roomTypeId}">1</td>
                    <td th:text="${room.hotelId}">1</td>
                    <td th:text="${room.status}">AVAILABLE</td>
                </tr>
                <tr th:if="${#lists.isEmpty(availability)}">
                    <td colspan="5" class="text-center text-muted">No rooms match the search criteria.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
