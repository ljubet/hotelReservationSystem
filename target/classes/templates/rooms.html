<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Rooms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Hotel Management</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbars">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbars">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/hotels">Hotels</a></li>
                <li class="nav-item"><a class="nav-link" href="/room-types">Room Types</a></li>
                <li class="nav-item"><a class="nav-link active" href="/rooms">Rooms</a></li>
                <li class="nav-item"><a class="nav-link" href="/guests">Guests</a></li>
                <li class="nav-item"><a class="nav-link" href="/reservations">Reservations</a></li>
                <li class="nav-item"><a class="nav-link" href="/availability">Availability</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="h3">Rooms</h1>
        <button class="btn btn-primary" type="button">New Room</button>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <form th:object="${roomForm}">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Room Number</label>
                        <input class="form-control" th:field="*{roomNumber}" placeholder="101">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Floor</label>
                        <input class="form-control" th:field="*{floor}" type="number" min="0" placeholder="1">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Status</label>
                        <select class="form-select" th:field="*{status}">
                            <option th:each="status : ${roomStatuses}" th:value="${status}" th:text="${status}">AVAILABLE</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Hotel</label>
                        <select class="form-select" th:field="*{hotelId}">
                            <option value="" selected>Select hotel</option>
                            <option th:each="hotel : ${hotels}" th:value="${hotel.id}" th:text="${hotel.name}">Hotel</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Room Type</label>
                        <select class="form-select" th:field="*{roomTypeId}">
                            <option value="" selected>Select room type</option>
                            <option th:each="roomType : ${roomTypes}" th:value="${roomType.id}" th:text="${roomType.name}">Room Type</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <button class="btn btn-success" type="submit">Save Room</button>
                        <button class="btn btn-outline-secondary" type="reset">Reset</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-header">Existing Rooms</div>
        <div class="table-responsive">
            <table class="table table-striped mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Room Number</th>
                    <th>Floor</th>
                    <th>Status</th>
                    <th>Hotel</th>
                    <th>Room Type</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="room : ${rooms}">
                    <td th:text="${room.id}">1</td>
                    <td th:text="${room.roomNumber}">101</td>
                    <td th:text="${room.floor}">1</td>
                    <td th:text="${room.status}">AVAILABLE</td>
                    <td th:text="${room.hotelId}">1</td>
                    <td th:text="${room.roomTypeId}">1</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" type="button">Edit</button>
                        <button class="btn btn-sm btn-outline-danger" type="button">Delete</button>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(rooms)}">
                    <td colspan="7" class="text-center text-muted">No rooms available.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
