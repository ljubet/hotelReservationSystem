<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Hotels</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Hotel Management</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbars">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbars">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link active" href="/hotels">Hotels</a></li>
                <li class="nav-item"><a class="nav-link" href="/room-types">Room Types</a></li>
                <li class="nav-item"><a class="nav-link" href="/rooms">Rooms</a></li>
                <li class="nav-item"><a class="nav-link" href="/guests">Guests</a></li>
                <li class="nav-item"><a class="nav-link" href="/reservations">Reservations</a></li>
                <li class="nav-item"><a class="nav-link" href="/availability">Availability</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="h3">Hotels</h1>
        <button class="btn btn-primary" type="button">New Hotel</button>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <form th:object="${hotelForm}">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Name</label>
                        <input class="form-control" th:field="*{name}" placeholder="Hotel name">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">City</label>
                        <input class="form-control" th:field="*{city}" placeholder="City">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Country</label>
                        <input class="form-control" th:field="*{country}" placeholder="Country">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" th:field="*{description}" rows="3" placeholder="Description"></textarea>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Address</label>
                        <input class="form-control" th:field="*{address}" placeholder="123 River Road">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Phone</label>
                        <input class="form-control" th:field="*{phone}" placeholder="+1-555-0100">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Email</label>
                        <input class="form-control" th:field="*{email}" placeholder="info@example.com">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Star Rating</label>
                        <input class="form-control" th:field="*{starRating}" type="number" min="1" max="5" placeholder="4">
                    </div>
                    <div class="col-12">
                        <button class="btn btn-success" type="submit">Save Hotel</button>
                        <button class="btn btn-outline-secondary" type="reset">Reset</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-header">Existing Hotels</div>
        <div class="table-responsive">
            <table class="table table-striped mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>City</th>
                    <th>Country</th>
                    <th>Rating</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="hotel : ${hotels}">
                    <td th:text="${hotel.id}">1</td>
                    <td th:text="${hotel.name}">Riverside Hotel</td>
                    <td th:text="${hotel.city}">Springfield</td>
                    <td th:text="${hotel.country}">USA</td>
                    <td th:text="${hotel.starRating}">4</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" type="button">Edit</button>
                        <button class="btn btn-sm btn-outline-danger" type="button">Delete</button>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(hotels)}">
                    <td colspan="6" class="text-center text-muted">No hotels available.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
