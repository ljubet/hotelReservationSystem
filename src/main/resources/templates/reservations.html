<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Reservations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Hotel Management</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbars">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbars">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/hotels">Hotels</a></li>
                <li class="nav-item"><a class="nav-link" href="/room-types">Room Types</a></li>
                <li class="nav-item"><a class="nav-link" href="/rooms">Rooms</a></li>
                <li class="nav-item"><a class="nav-link" href="/guests">Guests</a></li>
                <li class="nav-item"><a class="nav-link active" href="/reservations">Reservations</a></li>
                <li class="nav-item"><a class="nav-link" href="/availability">Availability</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="h3">Reservations</h1>
        <button class="btn btn-primary" type="button">New Reservation</button>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <form th:object="${reservationForm}">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Guest</label>
                        <select class="form-select" th:field="*{guestId}">
                            <option value="" selected>Select guest</option>
                            <option th:each="guest : ${guests}" th:value="${guest.id}" th:text="${guest.firstName + ' ' + guest.lastName}">Guest</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Room</label>
                        <select class="form-select" th:field="*{roomId}">
                            <option value="" selected>Select room</option>
                            <option th:each="room : ${rooms}" th:value="${room.id}" th:text="${room.roomNumber + ' - ' + room.roomTypeId}">Room</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Check-in</label>
                        <input class="form-control" th:field="*{checkInDate}" type="date">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Check-out</label>
                        <input class="form-control" th:field="*{checkOutDate}" type="date">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Guests</label>
                        <input class="form-control" th:field="*{numberOfGuests}" type="number" min="1" placeholder="2">
                    </div>
                    <div class="col-12">
                        <button class="btn btn-success" type="submit">Save Reservation</button>
                        <button class="btn btn-outline-secondary" type="reset">Reset</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-header">Existing Reservations</div>
        <div class="table-responsive">
            <table class="table table-striped mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Guest</th>
                    <th>Room</th>
                    <th>Dates</th>
                    <th>Status</th>
                    <th>Total</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="reservation : ${reservations}">
                    <td th:text="${reservation.id}">1</td>
                    <td th:text="${reservation.guestId}">1</td>
                    <td th:text="${reservation.roomId}">101</td>
                    <td th:text="${reservation.checkInDate + ' → ' + reservation.checkOutDate}">2026-06-10 → 2026-06-12</td>
                    <td th:text="${reservation.status}">PENDING</td>
                    <td th:text="${reservation.totalPrice}">$258.00</td>
                    <td>
                        <button class="btn btn-sm btn-outline-success" type="button">Confirm</button>
                        <button class="btn btn-sm btn-outline-danger" type="button">Cancel</button>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(reservations)}">
                    <td colspan="7" class="text-center text-muted">No reservations available.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
