<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Room Types</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Hotel Management</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbars">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbars">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/hotels">Hotels</a></li>
                <li class="nav-item"><a class="nav-link active" href="/room-types">Room Types</a></li>
                <li class="nav-item"><a class="nav-link" href="/rooms">Rooms</a></li>
                <li class="nav-item"><a class="nav-link" href="/guests">Guests</a></li>
                <li class="nav-item"><a class="nav-link" href="/reservations">Reservations</a></li>
                <li class="nav-item"><a class="nav-link" href="/availability">Availability</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="h3">Room Types</h1>
        <button class="btn btn-primary" type="button">New Room Type</button>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <form th:object="${roomTypeForm}">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Name</label>
                        <input class="form-control" th:field="*{name}" placeholder="Standard">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Max Guests</label>
                        <input class="form-control" th:field="*{maxGuests}" type="number" min="1" placeholder="2">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Base Price</label>
                        <input class="form-control" th:field="*{basePricePerNight}" type="number" step="0.01" placeholder="129.00">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" th:field="*{description}" rows="3" placeholder="Description"></textarea>
                    </div>
                    <div class="col-12">
                        <button class="btn btn-success" type="submit">Save Room Type</button>
                        <button class="btn btn-outline-secondary" type="reset">Reset</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-header">Existing Room Types</div>
        <div class="table-responsive">
            <table class="table table-striped mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Max Guests</th>
                    <th>Base Price</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="roomType : ${roomTypes}">
                    <td th:text="${roomType.id}">1</td>
                    <td th:text="${roomType.name}">Standard</td>
                    <td th:text="${roomType.maxGuests}">2</td>
                    <td th:text="${roomType.basePricePerNight}">$129.00</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" type="button">Edit</button>
                        <button class="btn btn-sm btn-outline-danger" type="button">Delete</button>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(roomTypes)}">
                    <td colspan="5" class="text-center text-muted">No room types available.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
