<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body>
<nav th:replace="~{fragments/layout :: guestNav}"></nav>
<main id="main-content" class="auth-page">
    <div class="container">
    <div class="row justify-content-center justify-content-lg-start">
        <div class="col-md-5">
            <div class="text-white mb-4">
                <h1 class="display-6 fw-bold">Create Your Stay Profile</h1>
                <p class="mb-0">Book rooms faster and keep your reservations in one place.</p>
            </div>
            <form th:action="@{/register}" th:object="${registerForm}" method="post" class="card auth-panel p-4">
                <div class="mb-3">
                    <label class="form-label" for="username">Username</label>
                    <input id="username" th:field="*{username}" class="form-control">
                    <div class="text-danger small" th:errors="*{username}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input id="email" th:field="*{email}" class="form-control">
                    <div class="text-danger small" th:errors="*{email}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input id="password" type="password" th:field="*{password}" class="form-control">
                    <div class="text-danger small" th:errors="*{password}"></div>
                </div>
                <button class="btn btn-gold" type="submit">Create Account</button>
            </form>
        </div>
    </div>
    </div>
</main>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
