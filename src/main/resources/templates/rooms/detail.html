<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${room.name})}"></head>
<body>
<nav th:replace="~{fragments/layout :: guestNav}"></nav>
<main id="main-content" class="container py-5">
    <div class="row g-5 align-items-start">
        <div class="col-lg-7">
            <img th:src="${room.imageUrl}" class="img-fluid rounded" th:alt="${room.name}">
        </div>
        <div class="col-lg-5">
            <div class="d-flex justify-content-between gap-3 align-items-start mb-3">
                <div>
                    <h1 th:text="${room.name}">Room</h1>
                    <p class="text-muted" th:text="${room.roomType + ' room for up to ' + room.capacity + ' guests'}"></p>
                    <div class="room-rating"><span>&#9733;</span> <span th:text="${room.rating + '/5 guest rating'}">4.8/5 guest rating</span></div>
                </div>
                <span th:if="${room.underRenovation or !room.available}" class="badge text-bg-warning">Unavailable</span>
            </div>
            <p class="lead" th:text="${room.description}">Description</p>
            <div class="d-flex flex-wrap gap-2 mb-4">
                <span class="badge rounded-pill text-bg-light border" th:each="amenity : ${amenities}" th:text="${amenity}">WiFi</span>
            </div>
            <div class="border-top border-bottom py-3 mb-4">
                <span class="h3" th:text="${'$' + room.pricePerNight}">$169</span>
                <span class="text-muted">per night</span>
            </div>
            <a th:if="${room.bookable}" class="btn btn-gold btn-lg" th:href="@{/reservations/new(roomId=${room.id})}">Reserve This Room</a>
            <a class="btn btn-outline-dark btn-lg" th:href="@{/rooms}">Back to Rooms</a>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: chatWidget}"></div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
