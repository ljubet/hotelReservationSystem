<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Conversations')}"></head>
<body>
<div class="admin-shell d-md-flex">
    <aside th:replace="~{fragments/layout :: adminSidebar}"></aside>
    <main class="flex-grow-1 p-4">
        <div th:replace="~{fragments/layout :: alerts}"></div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">Conversations</h1>
            <a class="btn btn-primary" th:href="@{/admin/conversations/new}">New Conversation</a>
        </div>
        <form class="row g-2 align-items-end mb-3" method="get" th:action="@{/admin/conversations}">
            <div class="col-md-4">
                <label class="form-label" for="category">Category</label>
                <select id="category" name="category" class="form-select">
                    <option value="">All</option>
                    <option th:each="category : ${categories}" th:value="${category}" th:text="${category}" th:selected="${category == selectedCategory}"></option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="status">Status</label>
                <select id="status" name="status" class="form-select">
                    <option value="">All</option>
                    <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}" th:selected="${status == selectedStatus}"></option>
                </select>
            </div>
            <div class="col-md-4"><button class="btn btn-primary w-100" type="submit">Filter</button></div>
        </form>
        <div class="card p-3">
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead><tr><th>Title</th><th>Category</th><th>Status</th><th>Turns</th><th>Created</th><th>Actions</th></tr></thead>
                    <tbody>
                    <tr th:each="conversation : ${conversations}">
                        <td th:text="${conversation.title}">Title</td>
                        <td th:text="${conversation.category}">GENERAL</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${conversation.status.name() == 'APPROVED'} ? ' text-bg-success' : ' text-bg-warning'"
                                  th:text="${conversation.status}">DRAFT</span>
                        </td>
                        <td th:text="${#lists.size(conversation.turns)}">2</td>
                        <td th:text="${#temporals.format(conversation.createdAt, 'yyyy-MM-dd')}">Date</td>
                        <td class="d-flex flex-wrap gap-2">
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/conversations/{id}(id=${conversation.id})}">View</a>
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/conversations/{id}/edit(id=${conversation.id})}">Edit</a>
                            <form th:action="@{/admin/conversations/{id}/approve(id=${conversation.id})}" method="post">
                                <button class="btn btn-sm btn-outline-success" type="submit">Approve</button>
                            </form>
                            <form th:action="@{/admin/conversations/{id}/delete(id=${conversation.id})}" method="post">
                                <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
