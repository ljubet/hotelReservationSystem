<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reservation Detail')}"></head>
<body>
<div class="admin-shell d-md-flex">
    <aside th:replace="~{fragments/layout :: adminSidebar}"></aside>
    <main class="flex-grow-1 p-4">
        <div th:replace="~{fragments/layout :: alerts}"></div>
        <div class="d-flex flex-column flex-md-row justify-content-between gap-3 align-items-md-center mb-4">
            <h1 class="h3 mb-0">Reservation Detail</h1>
            <a class="btn btn-outline-secondary" th:href="@{/admin/reservations}">Back To Reservations</a>
        </div>
        <div class="row g-4">
            <div class="col-lg-7">
                <div class="card p-4">
                    <dl class="row mb-0">
                        <dt class="col-sm-4">Guest</dt><dd class="col-sm-8" th:text="${reservation.guestName}">Guest</dd>
                        <dt class="col-sm-4">Email</dt><dd class="col-sm-8" th:text="${reservation.guestEmail}">Email</dd>
                        <dt class="col-sm-4">Room</dt><dd class="col-sm-8" th:text="${reservation.room.name}">Room</dd>
                        <dt class="col-sm-4">Dates</dt><dd class="col-sm-8" th:text="${reservation.checkIn + ' to ' + reservation.checkOut}">Dates</dd>
                        <dt class="col-sm-4">Total</dt><dd class="col-sm-8" th:text="${'$' + reservation.totalPrice}">$338</dd>
                        <dt class="col-sm-4">Payment</dt><dd class="col-sm-8">Pay at hotel</dd>
                        <dt class="col-sm-4">Status</dt>
                        <dd class="col-sm-8">
                            <span class="badge"
                                  th:classappend="${reservation.status.name() == 'CONFIRMED'} ? ' text-bg-success' : (${reservation.status.name() == 'CANCELLED'} ? ' text-bg-danger' : ' text-bg-warning')"
                                  th:text="${reservation.status}">PENDING</span>
                        </dd>
                    </dl>
                    <div class="d-flex flex-wrap gap-2 mt-4">
                        <a class="btn btn-primary" th:href="@{/admin/reservations/{id}/edit(id=${reservation.id})}">Edit Reservation</a>
                        <form th:action="@{/admin/reservations/{id}/confirm(id=${reservation.id})}" method="post">
                            <button class="btn btn-success" type="submit">Confirm</button>
                        </form>
                        <form th:action="@{/admin/reservations/{id}/cancel(id=${reservation.id})}" method="post">
                            <button class="btn btn-outline-danger" type="submit">Cancel</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-lg-5">
                <form class="card p-4" th:action="@{/admin/reservations/{id}/note(id=${reservation.id})}" method="post">
                    <label class="form-label" for="staffNote">Staff note</label>
                    <textarea id="staffNote" name="staffNote" class="form-control" rows="8" th:text="${reservation.staffNote}"></textarea>
                    <button class="btn btn-primary mt-3" type="submit">Save Note</button>
                </form>
            </div>
        </div>
    </main>
</div>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
