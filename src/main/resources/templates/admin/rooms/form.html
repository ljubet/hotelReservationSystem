<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div class="admin-shell d-md-flex">
    <aside th:replace="~{fragments/layout :: adminSidebar}"></aside>
    <main class="flex-grow-1 p-4">
        <h1 class="h3 mb-4" th:text="${pageTitle}">Room</h1>
        <form class="card p-4" th:object="${roomForm}" method="post"
              th:action="${roomId == null} ? @{/admin/rooms} : @{/admin/rooms/{id}/edit(id=${roomId})}">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label" for="name">Name</label>
                    <input id="name" th:field="*{name}" class="form-control">
                    <div class="text-danger small" th:errors="*{name}"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="roomType">Type</label>
                    <select id="roomType" th:field="*{roomType}" class="form-select">
                        <option th:each="type : ${roomTypes}" th:value="${type}" th:text="${type}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="capacity">Capacity</label>
                    <input id="capacity" th:field="*{capacity}" type="number" min="1" class="form-control">
                    <div class="text-danger small" th:errors="*{capacity}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="pricePerNight">Price per night</label>
                    <input id="pricePerNight" th:field="*{pricePerNight}" type="number" step="0.01" class="form-control">
                    <div class="text-danger small" th:errors="*{pricePerNight}"></div>
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="rating">Rating</label>
                    <input id="rating" th:field="*{rating}" type="number" min="1" max="5" step="0.1" class="form-control">
                    <div class="text-danger small" th:errors="*{rating}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="imageUrl">Image URL</label>
                    <input id="imageUrl" th:field="*{imageUrl}" class="form-control">
                </div>
                <div class="col-12">
                    <label class="form-label" for="description">Description</label>
                    <textarea id="description" th:field="*{description}" class="form-control" rows="4"></textarea>
                    <div class="text-danger small" th:errors="*{description}"></div>
                </div>
                <div class="col-12">
                    <label class="form-label" for="amenities">Amenities</label>
                    <input id="amenities" th:field="*{amenities}" class="form-control">
                </div>
                <div class="col-md-6 form-check ms-2">
                    <input id="available" th:field="*{available}" class="form-check-input" type="checkbox">
                    <label class="form-check-label" for="available">Available</label>
                </div>
                <div class="col-md-6 form-check ms-2">
                    <input id="underRenovation" th:field="*{underRenovation}" class="form-check-input" type="checkbox">
                    <label class="form-check-label" for="underRenovation">Under renovation</label>
                </div>
                <div class="col-12">
                    <div class="form-text">Rooms under renovation are automatically marked unavailable.</div>
                </div>
            </div>
            <div class="mt-4 d-flex gap-2">
                <button class="btn btn-primary" type="submit">Save</button>
                <a class="btn btn-outline-secondary" th:href="@{/admin/rooms}">Cancel</a>
            </div>
        </form>
    </main>
</div>
<script th:replace="~{fragments/layout :: scripts}"></script>
<script>
    const available = document.getElementById('available');
    const renovation = document.getElementById('underRenovation');
    function syncAvailability() {
        if (!available || !renovation) return;
        if (renovation.checked) {
            available.checked = false;
            available.disabled = true;
        } else {
            available.disabled = false;
        }
    }
    renovation.addEventListener('change', syncAvailability);
    syncAvailability();
</script>
</body>
</html>
