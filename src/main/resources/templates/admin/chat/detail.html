<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reply to Chat')}"></head>
<body>
<div class="admin-shell d-md-flex">
    <aside th:replace="~{fragments/layout :: adminSidebar}"></aside>
    <main class="flex-grow-1 p-4">
        <h1 class="h3 mb-4">Reply to Chat</h1>
        <div class="row g-4">
            <div class="col-lg-5">
                <div class="card p-4">
                    <div class="d-flex align-items-center gap-2 flex-wrap">
                        <h2 class="h5 mb-0" th:text="${message.senderName}">Guest</h2>
                        <span th:if="${message.aiAnswered == true}" class="badge text-bg-info">AI Answer</span>
                        <span th:if="${!message.answered}" class="badge text-bg-warning">Needs Reply</span>
                    </div>
                    <p class="text-muted" th:text="${message.senderEmail}">email</p>
                    <p th:text="${message.question}">Question</p>
                </div>
            </div>
            <div class="col-lg-7">
                <form class="card p-4" th:action="@{/admin/chat/{id}/reply(id=${message.id})}" method="post">
                    <label class="form-label" for="answer">Answer</label>
                    <textarea id="answer" name="answer" rows="8" class="form-control" required th:text="${message.answer}"></textarea>
                    <div class="form-check mt-3">
                        <input id="saveConversation" name="saveConversation" value="true" class="form-check-input" type="checkbox">
                        <label class="form-check-label" for="saveConversation">Save this exchange as a conversation transcript</label>
                    </div>
                    <button class="btn btn-primary mt-3" type="submit">Save Reply</button>
                </form>
            </div>
        </div>
    </main>
</div>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
