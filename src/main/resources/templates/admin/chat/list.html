<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Chat Inbox')}"></head>
<body>
<div class="admin-shell d-md-flex">
    <aside th:replace="~{fragments/layout :: adminSidebar}"></aside>
    <main class="flex-grow-1 p-4">
        <div th:replace="~{fragments/layout :: alerts}"></div>
        <h1 class="h3 mb-4">Chat Inbox</h1>
        <div class="card p-3">
            <div class="list-group list-group-flush">
                <a class="list-group-item list-group-item-action" th:each="message : ${messages}" th:href="@{/admin/chat/{id}(id=${message.id})}">
                    <div class="d-flex justify-content-between gap-3">
                        <strong th:text="${message.senderName}">Guest</strong>
                        <span class="small text-muted" th:text="${#temporals.format(message.createdAt, 'yyyy-MM-dd HH:mm')}">Date</span>
                    </div>
                    <div class="text-muted" th:text="${message.question}">Question</div>
                </a>
                <div th:if="${#lists.isEmpty(messages)}" class="text-muted p-3">No unanswered messages.</div>
            </div>
        </div>
    </main>
</div>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
