<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Chat Simulation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Hotel Management</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbars">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbars">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/hotels">Hotels</a></li>
                <li class="nav-item"><a class="nav-link" href="/room-types">Room Types</a></li>
                <li class="nav-item"><a class="nav-link" href="/rooms">Rooms</a></li>
                <li class="nav-item"><a class="nav-link" href="/guests">Guests</a></li>
                <li class="nav-item"><a class="nav-link" href="/reservations">Reservations</a></li>
                <li class="nav-item"><a class="nav-link" href="/availability">Availability</a></li>
                <li class="nav-item"><a class="nav-link" href="/conversations">Conversations</a></li>
                <li class="nav-item"><a class="nav-link active" href="/chat">Chat Simulation</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card mb-4">
                <div class="card-header">Simulate a Hotel Assistant</div>
                <div class="card-body">
                    <form th:action="@{/chat}" method="post" th:object="${chatForm}">
                        <div class="mb-3">
                            <label class="form-label">Guest question</label>
                            <textarea class="form-control" th:field="*{message}" rows="3"
                                      placeholder="Do you have breakfast?"></textarea>
                        </div>
                        <button class="btn btn-primary" type="submit">Simulate response</button>
                    </form>
                </div>
            </div>

            <div class="card" th:if="${chatResult != null}">
                <div class="card-header">Simulation Result</div>
                <div class="card-body">
                    <p class="text-muted mb-1">User</p>
                    <p class="fw-semibold" th:text="${chatResult.userMessage}">User message</p>
                    <p class="text-muted mb-1">Assistant</p>
                    <p class="fw-semibold" th:text="${chatResult.assistantResponse}">Assistant response</p>
                    <span class="badge bg-info text-dark" th:text="${chatResult.matchedCategory}">CATEGORY</span>
                    <span class="badge bg-secondary" th:text="${chatResult.source}">SOURCE</span>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
