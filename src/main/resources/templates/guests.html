<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Guests</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Hotel Management</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbars">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbars">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/hotels">Hotels</a></li>
                <li class="nav-item"><a class="nav-link" href="/room-types">Room Types</a></li>
                <li class="nav-item"><a class="nav-link" href="/rooms">Rooms</a></li>
                <li class="nav-item"><a class="nav-link active" href="/guests">Guests</a></li>
                <li class="nav-item"><a class="nav-link" href="/reservations">Reservations</a></li>
                <li class="nav-item"><a class="nav-link" href="/availability">Availability</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="h3">Guests</h1>
        <button class="btn btn-primary" type="button">New Guest</button>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <form th:object="${guestForm}">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">First Name</label>
                        <input class="form-control" th:field="*{firstName}" placeholder="Jamie">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Last Name</label>
                        <input class="form-control" th:field="*{lastName}" placeholder="Lee">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Email</label>
                        <input class="form-control" th:field="*{email}" placeholder="jamie@example.com">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Phone</label>
                        <input class="form-control" th:field="*{phone}" placeholder="+1-555-0199">
                    </div>
                    <div class="col-12">
                        <button class="btn btn-success" type="submit">Save Guest</button>
                        <button class="btn btn-outline-secondary" type="reset">Reset</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-header">Existing Guests</div>
        <div class="table-responsive">
            <table class="table table-striped mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="guest : ${guests}">
                    <td th:text="${guest.id}">1</td>
                    <td th:text="${guest.firstName + ' ' + guest.lastName}">Jamie Lee</td>
                    <td th:text="${guest.email}">jamie@example.com</td>
                    <td th:text="${guest.phone}">+1-555-0199</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" type="button">Edit</button>
                        <button class="btn btn-sm btn-outline-danger" type="button">Delete</button>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(guests)}">
                    <td colspan="5" class="text-center text-muted">No guests available.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
