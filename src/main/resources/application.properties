spring.application.name=hotel-conversation-builder

spring.datasource.url=jdbc:postgresql://localhost:5432/hotel_db
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3.1
spring.ai.ollama.chat.options.model=llama3.1
spring.ai.ollama.chat.options.temperature=0.3
spring.ai.ollama.init.pull-model-strategy=never

hotel.chatbot.system-prompt=You are a helpful concierge assistant for Aurora Hotel. Answer guest questions politely and professionally. Only answer questions related to the hotel, reservations, amenities, rooms, and services. Use the provided hotel tools when live room or reservation data is needed. If you do not know something, say the team will follow up shortly.

server.port=8080
